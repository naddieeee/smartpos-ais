<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartPOS AIS | Interactive Prototype</title>
<style>
:root{--navy:#102b4e;--blue:#1769aa;--cyan:#19a7b8;--bg:#f3f6fa;--card:#fff;--ink:#172b43;--muted:#718096;--line:#e5ebf2;--green:#15966b;--amber:#c47b16;--red:#c84b55;--shadow:0 8px 24px rgba(20,45,75,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}
.app{min-height:100vh;display:flex}.sidebar{width:235px;background:linear-gradient(180deg,#102b4e,#173e68);color:#fff;padding:24px 16px;display:flex;flex-direction:column;flex-shrink:0}
.brand{display:flex;align-items:center;gap:11px;padding:3px 8px 28px}.brandmark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#23b7c5,#1769aa);display:grid;place-items:center;font-weight:900;font-size:19px;box-shadow:0 5px 15px #061d3b66}.brand strong{display:block;font-size:17px;letter-spacing:.3px}.brand small{color:#b8cce0;font-size:10px;letter-spacing:1.5px}
.navlabel{font-size:10px;color:#91abc5;font-weight:700;letter-spacing:1.5px;padding:10px 12px}
.nav button{width:100%;border:0;background:transparent;color:#c8d7e7;text-align:left;padding:12px;border-radius:10px;margin:3px 0;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:12px}.nav button.active,.nav button:hover{background:#ffffff1b;color:#fff}.nav .ico{width:20px;text-align:center;font-size:16px}
.sidefoot{margin-top:auto;border-top:1px solid #ffffff22;padding:18px 8px 0;color:#a9bfd4;font-size:11px;line-height:1.6}
.main{min-width:0;flex:1}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:3}.crumb{font-size:13px;color:var(--muted)}.crumb b{color:var(--ink)}.user{display:flex;align-items:center;gap:10px;font-size:12px}.avatar{width:34px;height:34px;border-radius:50%;background:#e4f4f7;color:#147b8b;display:grid;place-items:center;font-weight:800}
.content{padding:28px 32px 40px;max-width:1500px;margin:auto}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:23px}.eyebrow{font-size:10px;letter-spacing:1.5px;color:var(--blue);font-weight:800;text-transform:uppercase}.pagehead h1{margin:6px 0 5px;font-size:26px;letter-spacing:-.6px}.sub{margin:0;color:var(--muted);font-size:13px}.pill{border-radius:30px;padding:7px 11px;background:#e9f7f5;color:#168467;font-size:11px;font-weight:700;white-space:nowrap}
.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow)}.stat{display:flex;justify-content:space-between;align-items:flex-start}.statlabel{color:var(--muted);font-size:12px}.statval{font-size:24px;font-weight:800;margin:9px 0 5px;letter-spacing:-.5px}.statnote{font-size:11px;color:var(--muted)}.staticon{width:37px;height:37px;border-radius:11px;background:#eaf3fb;display:grid;place-items:center;font-size:18px}
.two{grid-template-columns:1.4fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.cardhead h3{font-size:14px;margin:0}.muted{color:var(--muted);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.7px;padding:10px 8px;border-bottom:1px solid var(--line)}td{padding:12px 8px;border-bottom:1px solid #eef2f6}tr:last-child td{border-bottom:0}.right{text-align:right}.tag{display:inline-block;border-radius:20px;padding:4px 8px;font-size:10px;font-weight:700;background:#eaf7f1;color:#16845f}.tag.low{background:#fff4df;color:#a96a12}.tag.info{background:#eaf3fb;color:#226da7}
.barlist{display:grid;gap:13px}.barrow{display:grid;grid-template-columns:110px 1fr 50px;align-items:center;gap:10px;font-size:11px}.track{height:8px;background:#edf1f5;border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#1769aa,#20b2bd);border-radius:20px}
.notice{padding:12px 14px;border-radius:11px;background:#edf8fa;color:#276b79;font-size:12px;line-height:1.5;border:1px solid #d9eff2}
.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:700;font-size:12px;cursor:pointer}.btn:hover{filter:brightness(.94)}.btn.secondary{background:#edf3f8;color:#24577e}.btn.dark{background:var(--navy)}.btn.green{background:var(--green)}.btn.ghost{background:transparent;color:var(--blue);border:1px solid #cbddec}.btn.small{padding:7px 10px;font-size:11px}.btn:disabled{opacity:.45;cursor:not-allowed}
.poslayout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.9fr);gap:17px}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;display:flex;gap:12px;align-items:center}.productpic{width:62px;height:72px;border-radius:10px;background:linear-gradient(145deg,#f7fafc,#eef3fa);display:grid;place-items:center;overflow:hidden;flex-shrink:0}.productpic img{width:100%;height:100%;object-fit:contain;padding:3px}.productpic .fallback{font-size:26px}.product h4{margin:0 0 4px;font-size:12px}.product p{margin:0 0 7px;color:var(--muted);font-size:10px}.product .price{font-weight:800;font-size:13px}.product .add{margin-left:auto;align-self:flex-end}
.cartline{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}.qtybtn{border:1px solid var(--line);background:#fff;border-radius:6px;width:24px;height:24px;cursor:pointer}.cartfoot{margin-top:15px}.totalrow{display:flex;justify-content:space-between;margin:10px 0;font-size:12px}.totalrow.big{font-size:17px;font-weight:800;border-top:1px solid var(--line);padding-top:13px}.scanbox{display:flex;gap:9px;align-items:center;background:#f2f8fc;border:1px dashed #a9c9df;border-radius:11px;padding:12px;margin-bottom:14px}.scanbox .scanico{font-size:23px}.scanbox b{font-size:12px}.scanbox small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{text-align:center;padding:28px 8px;color:var(--muted);font-size:12px}.receipt{background:#fff;border:1px solid #dce3eb;border-radius:5px;padding:22px 24px;max-width:370px;margin:10px auto 0;font-family:Consolas,monospace;color:#263445;box-shadow:0 8px 22px #12243a12;position:relative}.receipt:after{content:"";position:absolute;bottom:-7px;left:0;right:0;height:8px;background:linear-gradient(135deg,#fff 25%,transparent 25%) 0 0/12px 12px,linear-gradient(225deg,#fff 25%,transparent 25%) 0 0/12px 12px}.receipt h3{text-align:center;margin:0 0 4px;font-size:17px;letter-spacing:.4px}.receipt p{text-align:center;color:#66778a;font-size:10px;margin:0 0 12px}.receipt .receipt-rule{border-top:1px dashed #aab6c4;margin:12px 0}.receipt .receipt-line{display:flex;justify-content:space-between;gap:12px;font-size:11px;margin:7px 0}.receipt .receipt-total{display:flex;justify-content:space-between;font-weight:900;font-size:16px;border-top:1px dashed #8797a8;padding-top:12px;margin-top:12px}.receipt .receipt-small{text-align:center;font-size:9px;color:#7b8794;margin-top:14px}
.modalback{position:fixed;inset:0;background:#07182c99;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modalback.show{display:flex}.modal{background:#fff;border-radius:17px;padding:25px;width:min(430px,100%);box-shadow:0 25px 70px #06182d55}.modal h2{margin:0 0 8px;font-size:20px}.modal p{color:var(--muted);font-size:12px;line-height:1.5}.successmark{width:55px;height:55px;background:#e5f7ef;color:#15966b;border-radius:50%;display:grid;place-items:center;font-size:28px;margin-bottom:15px}
.footerhint{margin-top:18px;color:var(--muted);font-size:10px;text-align:center}
@media(max-width:950px){.sidebar{width:190px}.stats{grid-template-columns:repeat(2,1fr)}.poslayout{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
@media(max-width:650px){.app{display:block}.sidebar{width:100%;padding:12px}.brand{padding:0 5px 10px}.nav{display:flex;overflow:auto}.navlabel,.sidefoot{display:none}.nav button{white-space:nowrap;width:auto;padding:9px}.topbar{padding:0 15px}.content{padding:20px 14px}.stats{grid-template-columns:repeat(2,1fr)}.products{grid-template-columns:1fr}.pagehead h1{font-size:22px}}
@media print{.sidebar,.topbar,.pagehead,.footerhint,.no-print{display:none!important}.content{padding:0}.card{box-shadow:none}}
body.presentation-mode,body.presentation-mode *{cursor:none!important}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#102b4e;color:#fff;padding:13px 20px;border-radius:12px;box-shadow:0 12px 35px #06182c44;font-size:13px;font-weight:700;z-index:30;transition:all .22s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scanpulse{animation:scanpulse .55s ease}
@keyframes scanpulse{0%{box-shadow:0 0 0 0 #19a7b866}100%{box-shadow:0 0 0 14px #19a7b800}}
.scanbox{position:relative;overflow:hidden}.scanbox.scanning:after{content:"";position:absolute;left:0;right:0;top:-5px;height:3px;background:#18a8bb;box-shadow:0 0 12px #18a8bb;animation:scanline .65s ease-in-out}.scanbox.scanning{background:#e7f8fa;border-color:#19a7b8}.scanbox .scan-tag{margin-left:auto;white-space:nowrap}.scan-keys{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 16px}.scan-key{border:1px solid #d8e4ee;background:#f7fafc;border-radius:8px;padding:6px 8px;font-size:10px;color:#42566d}.scan-key b{display:inline-grid;place-items:center;min-width:19px;height:19px;background:#173e68;color:#fff;border-radius:5px;margin-right:5px}.product.scanned{border-color:#20a6b5;box-shadow:0 0 0 2px #20a6b51a}.cart-thumb{width:34px;height:40px;object-fit:contain;background:#f5f8fb;border-radius:6px}.scan-flash{animation:flash .45s ease}@keyframes scanline{0%{top:-5px;opacity:0}15%{opacity:1}100%{top:100%;opacity:0}}@keyframes flash{0%{background:#e5f8f7}100%{background:white}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brandmark">S</div><div><strong>SmartPOS AIS</strong><small>SMART POINT-OF-SALE</small></div></div>
  <div class="navlabel">WORKSPACE</div>
  <nav class="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span> Dashboard</button>
    <button data-page="pos"><span class="ico">▣</span> POS / Sales</button>
    <button data-page="inventory"><span class="ico">▤</span> Inventory</button>
    <button data-page="accounting"><span class="ico">▧</span> Accounting</button>
    <button data-page="reports"><span class="ico">▥</span> Financial Reports</button>
  </nav>
  <div class="sidefoot">DEMO BUSINESS<br><b style="color:#fff">Farm Fresh Mini Mart</b><br><span style="font-size:10px">Illustrative prototype data</span></div>
</aside>
<main class="main">
<header class="topbar"><div class="crumb">Workspace&nbsp; / &nbsp;<b id="crumb">Dashboard</b></div><div class="user"><button class="btn small secondary" id="presentationBtn" onclick="togglePresentation()">◉ Presentation mode</button><span>Demo Admin</span><div class="avatar">DA</div></div></header>
<div class="content" id="content"></div>
</main>
</div>
<div class="modalback" id="modal"><div class="modal" id="modalbody"></div></div><div class="toast" id="toast">Barcode recognised</div>
<script>
const products=[
 {id:"FF001",name:"Farm Fresh UHT Fresh Milk 200ml",short:"Fresh Milk 200ml",price:2.60,cost:1.75,stock:40,icon:"🥛",key:"1",img:"https://shop.farmfresh.com.my/cdn/shop/files/fresh_milk.jpg?v=1767677045&width=1280"},
 {id:"FF002",name:"Farm Fresh UHT Chocolate Milk 200ml",short:"Chocolate Milk 200ml",price:2.60,cost:1.75,stock:35,icon:"🍫",key:"2",img:"https://shop.farmfresh.com.my/cdn/shop/collections/YarraChocolateR.jpg?v=1769765857&width=1600"},
 {id:"FF003",name:"Farm Fresh UHT Milk Taro Ube 200ml",short:"Taro Ube Milk 200ml",price:2.50,cost:1.65,stock:32,icon:"🥛",key:"3",img:"https://shop.farmfresh.com.my/cdn/shop/files/Taro_Ube_2.jpg?v=1778225761&width=1280"},
 {id:"FF004",name:"Farm Fresh UHT Kurma Milk 200ml",short:"Kurma Milk 200ml",price:2.50,cost:1.65,stock:24,icon:"🫘",key:"4",img:"https://shop.farmfresh.com.my/cdn/shop/files/kurma_09b710e2-4c10-47d1-9427-95fe24b68379.jpg?v=1767676832&width=1100"},
 {id:"FF007",name:"Farm Fresh The Butter Salted 200g",short:"The Butter Salted 200g",price:11.90,cost:8.20,stock:15,icon:"🧈",key:"5",img:"https://jgbj.jayagrocer.com/cdn/shop/files/188946-U-1-1.jpg?v=1770719877"}
]
const state={page:"dashboard",cart:{},sales:[],baseSales:1240,baseOrders:72,baseExpenses:420,baseCogs:690,baseCash:850,baseInventoryValue:530};
const money=n=>"RM"+Number(n).toFixed(2);
const allSales=()=>state.baseSales+state.sales.reduce((a,s)=>a+s.total,0);
const allOrders=()=>state.baseOrders+state.sales.length;
const allCogs=()=>state.baseCogs+state.sales.reduce((a,s)=>a+s.cogs,0);
const allExpenses=()=>state.baseExpenses;
const grossProfit=()=>allSales()-allCogs();
const netProfit=()=>grossProfit()-allExpenses();
function page(p){state.page=p;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));document.getElementById("crumb").textContent=({dashboard:"Dashboard",pos:"POS / Sales",inventory:"Inventory",accounting:"Accounting",reports:"Financial Reports"})[p];render()}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>page(b.dataset.page)));
function stat(label,value,note,icon){return `<div class="card"><div class="stat"><div><div class="statlabel">${label}</div><div class="statval">${value}</div><div class="statnote">${note}</div></div><div class="staticon">${icon}</div></div></div>`}
function dashboard(){return `<div class="pagehead"><div><div class="eyebrow">OVERVIEW</div><h1>Good day, Admin 👋</h1><p class="sub">Here's what's happening at Farm Fresh Mini Mart today.</p></div><span class="pill">● Demo environment</span></div>
<div class="grid stats">${stat("Total Sales",money(allSales()),`<span style="color:var(--green)">↑</span> Includes demo transactions`,"↗")}${stat("Total Orders",allOrders(),"Recorded sales transactions","▣")}${stat("Gross Profit",money(grossProfit()),"Sales less cost of goods sold","◈")}${stat("Net Profit",money(netProfit()),"After operating expenses","◎")}</div>
<div class="grid two"><div class="card"><div class="cardhead"><h3>Sales performance</h3><span class="muted">Illustrative monthly summary</span></div><div class="barlist">${[["Mon",48],["Tue",66],["Wed",42],["Thu",78],["Fri",60],["Sat",92],["Sun",72]].map(([d,v])=>`<div class="barrow"><span>${d}</span><div class="track"><div class="fill" style="width:${v}%"></div></div><b>${v}%</b></div>`).join("")}</div></div>
<div class="card"><div class="cardhead"><h3>Quick actions</h3><span class="muted">Go to a module</span></div><div style="display:grid;gap:10px"><button class="btn" onclick="page('pos')">＋ Start new sale</button><button class="btn secondary" onclick="page('inventory')">▤ Check inventory</button><button class="btn secondary" onclick="page('reports')">▥ View financial reports</button></div><div class="notice" style="margin-top:15px">SmartPOS AIS connects sales, inventory and accounting in one workflow.</div></div></div>
<div class="card" style="margin-top:17px"><div class="cardhead"><h3>Recent transactions</h3><button class="btn small ghost" onclick="page('pos')">New sale</button></div>${recentTable()}</div>`}
function recentTable(){let rows=state.sales.slice().reverse().slice(0,5);if(!rows.length)rows=[{id:"TXN-1048",date:"Today, 10:42 AM",items:"Farm Fresh products",total:42.60,status:"Completed"},{id:"TXN-1047",date:"Today, 10:18 AM",items:"Farm Fresh products",total:28.40,status:"Completed"},{id:"TXN-1046",date:"Today, 9:55 AM",items:"Farm Fresh products",total:16.80,status:"Completed"}];return `<table><thead><tr><th>Transaction ID</th><th>Date</th><th>Items</th><th class="right">Total</th><th>Status</th></tr></thead><tbody>${rows.map(s=>`<tr><td><b>${s.id}</b></td><td>${s.date}</td><td>${s.items||"Farm Fresh products"}</td><td class="right">${money(s.total)}</td><td><span class="tag">Completed</span></td></tr>`).join("")}</tbody></table>`}
function pos(){let cartItems=Object.entries(state.cart).map(([id,q])=>({p:products.find(x=>x.id===id),q}));let subtotal=cartItems.reduce((a,x)=>a+x.p.price*x.q,0);return `<div class="pagehead"><div><div class="eyebrow">SALES MODULE</div><h1>Point of Sale</h1><p class="sub">Scan Farm Fresh products and watch the sale update automatically.</p></div><span class="pill">● Register open</span></div>
<div class="poslayout"><div class="card"><div class="scanbox" id="scanbox"><div class="scanico">▥</div><div><b id="scanStatus">Scanner ready · Waiting for barcode</b><small>Present a product to the toy scanner, then press its assigned number key to simulate a barcode scan.</small></div><span class="tag info scan-tag">READY</span></div><div class="scan-keys">${products.map(p=>`<span class="scan-key"><b>${p.key}</b>${p.short}</span>`).join("")}</div><div class="cardhead"><h3>Farm Fresh product catalogue</h3><span class="muted">5 products · barcode simulation</span></div><div class="products">${products.map(p=>`<div class="product" id="product-${p.id}"><div class="productpic"><img src="${p.img}" alt="${p.name}" onerror="this.outerHTML='<span class=\'fallback\'>${p.icon}</span>'"></div><div style="min-width:0"><h4>${p.name}</h4><p>Code: ${p.id} · Stock: ${p.stock}</p><div class="price">${money(p.price)}</div></div><button class="btn small add" onclick="add('${p.id}')">Add</button></div>`).join("")}</div><div class="footerhint">Keyboard shortcuts: 1–5 simulate product scans · ENTER completes payment · F2 hides/shows cursor</div></div>
<div class="card"><div class="cardhead"><h3>Current order</h3><button class="btn small ghost" onclick="clearCart()">Clear</button></div>${cartItems.length?cartItems.map(x=>`<div class="cartline"><img class="cart-thumb" src="${x.p.img}" alt="" onerror="this.style.display='none'"><div style="flex:1"><b>${x.p.short}</b><div class="muted">${money(x.p.price)} each</div></div><div style="display:flex;align-items:center;gap:6px"><button class="qtybtn" onclick="changeQty('${x.p.id}',-1)">−</button><b>${x.q}</b><button class="qtybtn" onclick="changeQty('${x.p.id}',1)">+</button></div><b style="width:70px;text-align:right">${money(x.p.price*x.q)}</b></div>`).join(""):`<div class="empty">🛒<br><br>No products added yet.<br>Scan a product to begin.</div>`}
<div class="cartfoot"><div class="totalrow"><span>Subtotal</span><b>${money(subtotal)}</b></div><div class="totalrow"><span>Tax</span><span>RM0.00</span></div><div class="totalrow big"><span>Total due</span><span>${money(subtotal)}</span></div><button class="btn green" style="width:100%;margin-top:8px" onclick="checkout()" ${cartItems.length?"":"disabled"}>Complete payment →</button><div class="footerhint">Demo checkout · Cash payment · You can also press ENTER to complete payment</div></div></div></div>`}
function add(id){let p=products.find(x=>x.id===id);if(p.stock-(state.cart[id]||0)<=0){alert("No more stock available for this demo item.");return}state.cart[id]=(state.cart[id]||0)+1;render()}
function changeQty(id,n){state.cart[id]=(state.cart[id]||0)+n;if(state.cart[id]<=0)delete state.cart[id];render()}
function clearCart(){state.cart={};render()}
function checkout(){let items=Object.entries(state.cart).map(([id,q])=>({p:products.find(x=>x.id===id),q}));if(!items.length)return;let total=items.reduce((a,x)=>a+x.p.price*x.q,0),cogs=items.reduce((a,x)=>a+x.p.cost*x.q,0);items.forEach(x=>x.p.stock-=x.q);let sale={id:"SP-"+String(1049+state.sales.length),date:new Date().toLocaleString(),items:items.map(x=>x.p.short+" ×"+x.q).join(", "),total,cogs,details:items};state.sales.push(sale);state.cart={};state.lastSale=sale;showReceipt(sale);render()}
function showReceipt(s){let itemCount=s.details.reduce((a,x)=>a+x.q,0);document.getElementById("modalbody").innerHTML=`<div class="successmark">✓</div><h2>Payment successful</h2><p>Transaction recorded. The prototype has updated inventory and accounting records.</p><div class="receipt"><h3>FARM FRESH MINI MART</h3><p>SMARTPOS AIS · SALES RECEIPT</p><div class="receipt-rule"></div><div class="receipt-line"><span>Receipt No.</span><b>${s.id}</b></div><div class="receipt-line"><span>Date</span><span>${s.date}</span></div><div class="receipt-line"><span>Cashier</span><span>Demo Admin</span></div><div class="receipt-rule"></div>${s.details.map(x=>`<div class="receipt-line"><span>${x.p.short}<br><small>${x.q} × ${money(x.p.price)}</small></span><b>${money(x.p.price*x.q)}</b></div>`).join("")}<div class="receipt-rule"></div><div class="receipt-line"><span>Items</span><b>${itemCount}</b></div><div class="receipt-line"><span>Subtotal</span><b>${money(s.total)}</b></div><div class="receipt-line"><span>Tax</span><b>RM0.00</b></div><div class="receipt-total"><span>TOTAL</span><span>${money(s.total)}</span></div><div class="receipt-line"><span>Payment method</span><b>CASH</b></div><div class="receipt-rule"></div><div class="receipt-small">THANK YOU FOR SHOPPING WITH US!<br>Have a fresh day ☺<br><br>*** DEMO RECEIPT · NOT A TAX INVOICE ***</div></div><div class="actions no-print" style="margin-top:18px;justify-content:center"><button class="btn secondary" onclick="window.print()">Print receipt</button><button class="btn green" onclick="closeModal();page('inventory')">View updated stock</button><button class="btn secondary" onclick="closeModal();page('accounting')">View accounting</button></div>`;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function inventory(){return `<div class="pagehead"><div><div class="eyebrow">INVENTORY MODULE</div><h1>Inventory management</h1><p class="sub">Monitor product quantities and stock availability.</p></div><span class="pill">● Live demo data</span></div><div class="grid stats">${stat("Product types",products.length,"Registered products","▤")}${stat("Total units",products.reduce((a,p)=>a+p.stock,0),"Available stock","📦")}${stat("Low-stock items",products.filter(p=>p.stock<=5).length,"Reorder threshold: 5 units","⚑")}${stat("Stock value",money(products.reduce((a,p)=>a+p.stock*p.cost,0)),"At illustrative purchase cost","◈")}</div><div class="card"><div class="cardhead"><h3>Product stock list</h3><span class="muted">Quantity updates after checkout</span></div><table><thead><tr><th>Product</th><th>Product code</th><th>Unit cost</th><th>Selling price</th><th class="right">Available stock</th><th>Status</th></tr></thead><tbody>${products.map(p=>`<tr><td><b>${p.icon} ${p.name}</b></td><td>${p.id}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td class="right"><b>${p.stock}</b></td><td><span class="tag ${p.stock<=5?"low":""}">${p.stock<=5?"Low stock":"In stock"}</span></td></tr>`).join("")}</tbody></table></div><div class="notice" style="margin-top:15px">Automatic inventory update: when a sale is completed in the POS module, the quantity sold is deducted from available stock.</div>`}
function journalRows(){let rows=[];state.sales.forEach(s=>{rows.push({date:s.date,ref:s.id,account:"Cash",debit:s.total,credit:0},{date:s.date,ref:s.id,account:"Sales Revenue",debit:0,credit:s.total},{date:s.date,ref:s.id,account:"Cost of Goods Sold",debit:s.cogs,credit:0},{date:s.date,ref:s.id,account:"Inventory",debit:0,credit:s.cogs})});if(!rows.length)rows=[{date:"Today",ref:"TXN-1048",account:"Cash",debit:42.60,credit:0},{date:"Today",ref:"TXN-1048",account:"Sales Revenue",debit:0,credit:42.60},{date:"Today",ref:"TXN-1048",account:"Cost of Goods Sold",debit:29.40,credit:0},{date:"Today",ref:"TXN-1048",account:"Inventory",debit:0,credit:29.40}];return rows}
function accounting(){let rows=journalRows();return `<div class="pagehead"><div><div class="eyebrow">ACCOUNTING MODULE</div><h1>Accounting records</h1><p class="sub">Sales transactions are translated into double-entry accounting records.</p></div><span class="pill">● Auto-generated demo entries</span></div><div class="grid three">${stat("Sales revenue",money(allSales()),"Credit balance","↗")}${stat("Cost of goods sold",money(allCogs()),"Debit balance","▤")}${stat("Gross profit",money(grossProfit()),"Revenue less COGS","◈")}</div><div class="card" style="margin-top:17px"><div class="cardhead"><h3>Journal entries</h3><span class="muted">Double-entry bookkeeping</span></div><table><thead><tr><th>Date</th><th>Reference</th><th>Account</th><th class="right">Debit</th><th class="right">Credit</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.date}</td><td>${r.ref}</td><td><b>${r.account}</b></td><td class="right">${r.debit?money(r.debit):"—"}</td><td class="right">${r.credit?money(r.credit):"—"}</td></tr>`).join("")}</tbody></table></div><div class="notice" style="margin-top:15px"><b>Accounting logic:</b> A cash sale debits Cash and credits Sales Revenue. The related cost entry debits Cost of Goods Sold and credits Inventory. The figures shown are illustrative.</div>`}
function reports(){return `<div class="pagehead"><div><div class="eyebrow">REPORTING MODULE</div><h1>Financial reports</h1><p class="sub">A clear summary of the business's financial performance.</p></div><button class="btn secondary no-print" onclick="window.print()">⤓ Print report</button></div><div class="grid stats">${stat("Total revenue",money(allSales()),"Sales generated","↗")}${stat("Total expenses",money(allExpenses()+allCogs()),"Operating expenses + COGS","▤")}${stat("Gross profit",money(grossProfit()),"Before operating expenses","◈")}${stat("Net profit",money(netProfit()),"After operating expenses","◎")}</div><div class="grid two"><div class="card"><div class="cardhead"><h3>Income statement</h3><span class="muted">Illustrative period</span></div><table><tbody><tr><td><b>Revenue</b></td><td class="right"><b>${money(allSales())}</b></td></tr><tr><td>Less: Cost of goods sold</td><td class="right">${money(allCogs())}</td></tr><tr><td><b>Gross profit</b></td><td class="right"><b>${money(grossProfit())}</b></td></tr><tr><td>Less: Operating expenses</td><td class="right">${money(allExpenses())}</td></tr><tr><td style="padding-top:17px"><b>Net profit</b></td><td class="right" style="padding-top:17px;color:var(--green)"><b>${money(netProfit())}</b></td></tr></tbody></table></div><div class="card"><div class="cardhead"><h3>Sales summary</h3><span class="muted">Transaction overview</span></div><div class="totalrow"><span>Total orders</span><b>${allOrders()}</b></div><div class="totalrow"><span>Average order value</span><b>${money(allSales()/allOrders())}</b></div><div class="totalrow"><span>New demo transactions</span><b>${state.sales.length}</b></div><div class="notice" style="margin-top:15px">Reports reflect the sales and accounting data currently displayed in this prototype.</div></div></div>`}
function togglePresentation(){document.body.classList.toggle("presentation-mode");let on=document.body.classList.contains("presentation-mode");let b=document.getElementById("presentationBtn");if(b)b.textContent=on?"✓ Presentation mode on":"◉ Presentation mode";showToast(on?"Presentation mode enabled · cursor hidden":"Presentation mode disabled");}
let toastTimer;
function showToast(message){let t=document.getElementById("toast");t.textContent=message;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),1900);}
function simulateScan(id){if(state.page!=="pos"||document.getElementById("modal").classList.contains("show"))return;let p=products.find(x=>x.id===id);if(!p)return;let box=document.getElementById("scanbox");if(box){box.classList.remove("scanpulse","scanning");void box.offsetWidth;box.classList.add("scanpulse","scanning");document.getElementById("scanStatus").textContent="Barcode recognised · "+p.short;let tag=box.querySelector(".scan-tag");if(tag)tag.textContent="SCANNED ✓";}let card=document.getElementById("product-"+id);if(card){card.classList.add("scanned","scan-flash");setTimeout(()=>card.classList.remove("scanned","scan-flash"),850);}add(id);showToast("✓ Barcode recognised · "+p.short+" added to order");}
document.addEventListener("keydown",e=>{
 if(e.key==="F2"){e.preventDefault();togglePresentation();return;}
 if(state.page!=="pos"||document.getElementById("modal").classList.contains("show"))return;
 if(e.key==="Enter"){
   if(Object.keys(state.cart).length){e.preventDefault();checkout();}
   return;
 }
 let product=products.find(p=>p.key===e.key);
 if(product){e.preventDefault();simulateScan(product.id);}
});
function render(){let c=document.getElementById("content");c.innerHTML=({dashboard,pos,inventory,accounting,reports})[state.page]();if(state.page==="pos"){}}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
function resetDemo(){if(!confirm("Reset this demo to its starting figures?"))return;products[0].stock=40;products[1].stock=35;products[2].stock=32;products[3].stock=24;products[4].stock=15;state.sales=[];state.cart={};state.page="dashboard";page("dashboard")}
render();
</script>
</body>
</html>
